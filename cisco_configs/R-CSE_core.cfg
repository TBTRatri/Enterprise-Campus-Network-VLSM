! ==========================================
! Router: R-CSE (Core Router)
! ==========================================
enable
conf t
hostname R-CSE
no ip domain-lookup

! CSE LAN Interface
interface g0/1
 ip address 16.69.0.1 255.255.255.0
 no shutdown
exit

! Backbone to Core Switch (CSE-EEE-BBS Backbone: 16.69.4.64/29)
interface g0/0
 no ip address
 ip address 16.69.4.65 255.255.255.248
 no shutdown
exit

! WAN Link to MNS (16.69.4.72/30)
interface s0/0/0
 no ip address
 ip address 16.69.4.73 255.255.255.252
 clock rate 64000
 no shutdown
exit

! WAN Link to LAW (16.69.4.76/30)
interface s0/0/1
 no ip address
 ip address 16.69.4.77 255.255.255.252
 clock rate 64000
 no shutdown
exit

! WAN Link to BIL (16.69.4.80/30)
interface s0/1/0
 no ip address
 ip address 16.69.4.81 255.255.255.252
 clock rate 64000
 no shutdown
exit

! Centralized DHCP Pools (MNS + EEE)
ip dhcp excluded-address 16.69.2.1 16.69.2.60
ip dhcp excluded-address 16.69.3.129 16.69.3.139

ip dhcp pool MNS_POOL
 network 16.69.2.0 255.255.255.0
 default-router 16.69.2.1
 dns-server 16.69.0.10
exit

ip dhcp pool EEE_POOL
 network 16.69.3.128 255.255.255.128
 default-router 16.69.3.129
 dns-server 16.69.0.10
exit

! Static Routes to Remote Departments
ip route 16.69.2.0 255.255.255.0 16.69.4.74
ip route 16.69.3.0 255.255.255.128 16.69.4.82
ip route 16.69.4.0 255.255.255.192 16.69.4.78

! Dynamic RIPv2 Routing (Backbone Exchange)
router rip
 version 2
 no auto-summary
 network 16.0.0.0
exit

end
wr
