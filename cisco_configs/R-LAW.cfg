! ==========================================
! Router: R-LAW
! ==========================================
enable
conf t
hostname R-LAW
no ip domain-lookup

! LAW Local LAN Interface
interface g0/1
 ip address 16.69.4.1 255.255.255.192
 no shutdown
exit

! WAN Serial Link to CSE (16.69.4.76/30)
interface s0/0/0
 no ip address
 ip address 16.69.4.78 255.255.255.252
 no shutdown
exit

! Redundant WAN Link to BIL (16.69.4.84/30)
interface s0/0/1
 no ip address
 ip address 16.69.4.85 255.255.255.252
 clock rate 64000
 no shutdown
exit

! Local DHCP Pool for LAW Department
ip dhcp excluded-address 16.69.4.1 16.69.4.9
ip dhcp excluded-address 16.69.4.10 16.69.4.10

ip dhcp pool LAW_POOL
 network 16.69.4.0 255.255.255.192
 default-router 16.69.4.1
 dns-server 16.69.0.10
exit

! Primary Route to CSE & Floating Backup Route via BIL (AD = 5)
ip route 0.0.0.0 0.0.0.0 16.69.4.77
ip route 0.0.0.0 0.0.0.0 16.69.4.86 5

end
wr
