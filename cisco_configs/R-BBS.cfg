! ==========================================
! Router: R-BBS
! ==========================================
enable
conf t
hostname R-BBS
no ip domain-lookup

! Backbone to Core Switch
interface g0/0
 no ip address
 ip address 16.69.4.67 255.255.255.248
 no shutdown
exit

! BBS LAN Interface
interface g0/1
 ip address 16.69.1.1 255.255.255.0
 no shutdown
exit

! Dynamic RIPv2 Routing
router rip
 version 2
 no auto-summary
 network 16.0.0.0
exit

! Default Route to Core Switch Gateway
ip route 0.0.0.0 0.0.0.0 16.69.4.65

end
wr
