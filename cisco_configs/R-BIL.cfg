! ==========================================
! Router: R-BIL
! ==========================================
enable
conf t
hostname R-BIL
no ip domain-lookup

! BIL Local LAN Interface
interface g0/1
 ip address 16.69.3.1 255.255.255.128
 no shutdown
exit

! WAN Serial Link to CSE (16.69.4.80/30)
interface s0/0/0
 no ip address
 ip address 16.69.4.82 255.255.255.252
 no shutdown
exit

! Redundant WAN Link to LAW (16.69.4.84/30)
interface s0/0/1
 no ip address
 ip address 16.69.4.86 255.255.255.252
 no shutdown
exit

! Local DHCP Pool for BIL Department
ip dhcp excluded-address 16.69.3.1 16.69.3.9

ip dhcp pool BIL_POOL
 network 16.69.3.0 255.255.255.128
 default-router 16.69.3.1
 dns-server 16.69.0.10
exit

! Primary Route to CSE & Floating Backup Route via LAW (AD = 5)
ip route 0.0.0.0 0.0.0.0 16.69.4.81
ip route 0.0.0.0 0.0.0.0 16.69.4.85 5

end
wr
