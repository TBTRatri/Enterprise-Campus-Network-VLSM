! ==========================================
! Router: R-MNS
! ==========================================
enable
conf t
hostname R-MNS
no ip domain-lookup

! WAN Serial Link to CSE (16.69.4.72/30)
interface s0/0/0
 no ip address
 ip address 16.69.4.74 255.255.255.252
 no shutdown
exit

! MNS LAN + DHCP Relay to CSE Router
interface g0/1
 ip address 16.69.2.1 255.255.255.0
 ip helper-address 16.69.4.73
 no shutdown
exit

! Default Route pointing to CSE Core Router
ip route 0.0.0.0 0.0.0.0 16.69.4.73

end
wr
